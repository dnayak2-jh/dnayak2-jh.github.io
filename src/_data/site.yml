headline: Neural surrogates that stay accurate long after the training window ends.
bio: >
  I work on scientific machine learning for time-dependent PDEs: scalable, reliable,
  mesh-invariant surrogates that couple neural operators and graph networks with
  numerical time integration. I am advised by
